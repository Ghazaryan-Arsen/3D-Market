<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - 3D Market Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#00aaff',
                        'brand-dark': '#1a1a1a',
                        'brand-surface': '#2c2c2c',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark text-white font-sans">
    <header class="bg-brand-surface border-b border-gray-700">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">3DMP</a>
            <div class="hidden md:flex items-center space-x-6">
                <a href="marketplace.html" class="hover:text-brand-blue">Marketplace</a>
                <a href="upload.html" class="hover:text-brand-blue">Upload</a>
                <a href="profile.html" class="hover:text-brand-blue">Profile</a>
                <a href="admin.html" class="hover:text-brand-blue">Admin</a>
            </div>
            <div class="hidden md:flex items-center space-x-4">
                <button class="border border-brand-blue text-brand-blue px-4 py-2 rounded hover:bg-brand-blue hover:text-white transition">Login</button>
                <button class="bg-brand-blue text-white px-4 py-2 rounded hover:bg-blue-600 transition">Register</button>
            </div>
            <div class="md:hidden">
                <button id="mobile-menu-button" class="text-white focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
            </div>
        </nav>
        <div id="mobile-menu" class="hidden md:hidden">
            <a href="marketplace.html" class="block py-2 px-4 text-sm hover:bg-gray-700">Marketplace</a>
            <a href="upload.html" class="block py-2 px-4 text-sm hover:bg-gray-700">Upload</a>
            <a href="profile.html" class="block py-2 px-4 text-sm hover:bg-gray-700">Profile</a>
            <a href="admin.html" class="block py-2 px-4 text-sm hover:bg-gray-700">Admin</a>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div class="max-w-3xl mx-auto bg-brand-surface p-6 md:p-8 rounded-lg">
            <h1 class="text-2xl md:text-3xl font-bold mb-6 text-center">Upload Your 3D Model</h1>
            <form id="upload-form">
                <div class="mb-4">
                    <label for="name" class="block text-gray-300 mb-2">Model Name</label>
                    <input type="text" id="name" name="name" class="w-full bg-gray-800 border border-gray-700 rounded p-3" required>
                </div>
                <div class="mb-4">
                    <label for="description" class="block text-gray-300 mb-2">Description</label>
                    <textarea id="description" name="description" rows="4" class="w-full bg-gray-800 border border-gray-700 rounded p-3" required></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="category" class="block text-gray-300 mb-2">Category</label>
                        <select id="category" name="category" class="w-full bg-gray-800 border border-gray-700 rounded p-3" required>
                            <option value="">Select a category</option>
                            <option value="sci-fi">Sci-Fi</option>
                            <option value="fantasy">Fantasy</option>
                            <option value="architecture">Architecture</option>
                            <option value="characters">Characters</option>
                        </select>
                    </div>
                    <div>
                        <label for="price" class="block text-gray-300 mb-2">Price ($)</label>
                        <input type="number" id="price" name="price" min="0" step="0.01" class="w-full bg-gray-800 border border-gray-700 rounded p-3" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="tags" class="block text-gray-300 mb-2">Tags (comma-separated)</label>
                    <input type="text" id="tags" name="tags" class="w-full bg-gray-800 border border-gray-700 rounded p-3">
                </div>
                <div class="mb-6">
                    <label for="file-upload" class="block text-gray-300 mb-2">Model Files (STL, OBJ, FBX)</label>
                    <input type="file" id="file-upload" name="file-upload" accept=".stl,.obj,.fbx" class="w-full text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand-blue file:text-white hover:file:bg-blue-600" required>
                </div>
                <button type="submit" class="w-full bg-brand-blue text-white py-3 rounded-lg font-bold hover:bg-blue-600 transition">Submit Model</button>
            </form>
        </div>
    </main>

    <footer class="bg-brand-surface border-t border-gray-700 mt-16">
        <div class="container mx-auto px-6 py-8 text-center text-gray-400">
            <div class="flex flex-col md:flex-row justify-center space-y-4 md:space-y-0 md:space-x-6 mb-4">
                <a href="#" class="hover:text-white">About</a>
                <a href="#" class="hover:text-white">Contact</a>
                <a href="#" class="hover:text-white">Terms of Service</a>
                <a href="#" class="hover:text-white">Privacy Policy</a>
            </div>
            <p>&copy; 2023 3D Market Platform. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
